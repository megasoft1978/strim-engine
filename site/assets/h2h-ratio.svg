.hv .bd{fill:#2A2C34;opacity:.5}.hv .o{stroke:#ECEDEF;stroke-width:1.3}
.hv .fg{fill:#ECEDEF}.hv .fs{fill:#7C7CF5}.hv .fr{fill:#686B76}.hv .fv{fill:#7A7D88}.hv .fq{fill:#9699A4}.hv .fp{fill:#B3B6BF}
.hv .ls{stroke:#7C7CF5}.hv .lr{stroke:#686B76;stroke-width:1.6}.hv .lv{stroke:#7A7D88;stroke-width:1.6}.hv .lq{stroke:#9699A4;stroke-width:1.6}.hv .lp{stroke:#B3B6BF;stroke-width:1.6}
.hv .pw rect,.hv .pl rect,.hv .pt rect{fill:#1B1C22;stroke:#2A2C34}.hv .pl rect{stroke-dasharray:3 2}
.hv .pw text{fill:#ECEDEF}.hv .pl text{fill:#A3A6B1}.hv .pt text{fill:#A3A6B1}
.hv .pw text,.hv .pl text,.hv .pt text{font-size:11px;font-weight:700}
.hv .hh{font-size:13px;font-weight:700}.hv .hv1{font-weight:700}
.hv .nltk{stroke:#A3A6B1;opacity:.55}.hv .nlld{stroke:#A3A6B1;stroke-width:1;opacity:.5;stroke-dasharray:2 3}.hv .nlld.hot{stroke:#7C7CF5;opacity:.8}
.hv .nlaxis{stroke:#2A2C34;stroke-width:1.5}.hv .strim-dot{fill:#7C7CF5;stroke:#7C7CF5;stroke-width:2}.hv .strim-track{stroke:#7C7CF5;opacity:1}
