.hv .gnum{font-size:30px;font-weight:700;letter-spacing:-.04em}.hv .gnum.lose{fill:#A3A6B1}
.hv .chipr{fill:none;stroke:#A3A6B1}</style><rect class="bg" x="1" y="1" width="998" height="506" rx="26"/><text x="26" y="42" style="font-size:22px;font-weight:700;letter-spacing:-.02em">Strim today, over its best rival in each measurement</text><text x="26" y="62" class="m mo" style="font-size:12px">Ratio to the best rival, 1.00x is equal, above is faster. First-token times are inverted so that right is always better.</text><g transform="translate(26 78)"><rect width="300" height="176" rx="12" class="gcard"/><text x="20" y="36" style="font-size:16px;font-weight:600">Decode at 4K context</text><g transform="translate(20 62) scale(1.6)"><path d="M8 40A32 32 0 0 1 72 40" class="gb"/><path d="M27.6 10.5A32 32 0 0 1 49.2 9.4" class="gv" pathLength="1"/><line x1="30.5" y1="17.4" x2="26.3" y2="7.3" class="g1"/><circle cx="49.2" cy="9.4" r="3.6" class="gd"/></g><text x="158" y="112" class="gnum">1.50x</text><text x="158" y="132" class="m mo" style="font-size:12px">vs rapid-mlx</text><text x="20" y="162" class="m mo" style="font-size:11px">Strim 75.3 vs rapid-mlx 50.1 tok/s</text></g><g transform="translate(350 78)"><rect width="300" height="176" rx="12" class="gcard"/><text x="20" y="36" style="font-size:16px;font-weight:600">Decode at 32K context</text><g transform="translate(20 62) scale(1.6)"><path d="M8 40A32 32 0 0 1 72 40" class="gb"/><path d="M27.6 10.5A32 32 0 0 1 38.8 8" class="gv" pathLength="1"/><line x1="30.5" y1="17.4" x2="26.3" y2="7.3" class="g1"/><circle cx="38.8" cy="8" r="3.6" class="gd"/></g><text x="158" y="112" class="gnum">1.24x</text><text x="158" y="132" class="m mo" style="font-size:12px">vs rapid-mlx</text><text x="20" y="162" class="m mo" style="font-size:11px">Strim 52.2 vs rapid-mlx 42.2 tok/s</text></g><g transform="translate(674 78)"><rect width="300" height="176" rx="12" class="gcard"/><text x="20" y="36" style="font-size:16px;font-weight:600">4 agents on a shared 16K prefix</text><g transform="translate(20 62) scale(1.6)"><path d="M8 40A32