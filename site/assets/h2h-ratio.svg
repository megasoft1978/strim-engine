<svg class="hv gr" viewBox="0 0 1000 508" role="img" aria-labelledby="hr-t hr-d" xmlns="http://www.w3.org/2000/svg" width="1000" height="508"><title id="hr-t">Strim against its best rival, ratio per measurement</title><desc id="hr-d">Strim over its best rival in each measurement, 1.00x is the same speed, above is faster, first-token times inverted: Decode at 4K context 1.50x over rapid-mlx; Decode at 32K context 1.24x over rapid-mlx; 4 agents on a shared 16K prefix 2.81x over mlx-vlm; 8 agents at once: median first token 1.66x over rapid-mlx; Cold 32K prompt: first token 0.96x over mlx-vlm; 8 agents at once: total throughput 1.00x over mlx-vlm.</desc><style>.hv text{font:12px -apple-system,"Helvetica Neue",Arial,system-ui,sans-serif;fill:#F1EFFF}
.hv .mo{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.hv .m{fill:#A29FC8}.hv .b{font-weight:700}.hv .s{font-size:10.5px}.hv .c{text-anchor:middle}.hv .e{text-anchor:end}
