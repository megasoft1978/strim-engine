.hv .gnum{font-size:30px;font-weight:700;letter-spacing:-.04em}.hv .gnum.lose{fill:#A29FC8}
.hv .chipr{fill:none;stroke:#A29FC8}</style><rect class="bg" x="1" y="1" width="998" height="506" rx="26"/><defs><linearGradient id="gr" gradientUnits="userSpaceOnUse" x1="8" y1="0" x2="72" y2="0"><stop offset="0" stop-color="#7C7BFF"/><stop offset=".5" stop-color="#B25CFF"/><stop offset="1" stop-color="#FF4FD0"/></linearGradient><linearGradient id="gt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C7BFF"/><stop offset=".5" stop-color="#B25CFF"/><stop offset="1" stop-color="#FF4FD0"/></linearGradient></defs><text x="26" y="42" style="font-size:22px;font-weight:700;letter-spacing:-.02em">Strim today, over its best rival in each measurement</text><text x="26" y="62" class="m mo" style="font-size:12px">Ratio to the best rival, 1.00x is equal, above is faster. First-token times are inverted so that right is always better.</text><g transform="translate(26 78)"><rect width="300" height="176" rx="22" class="gcard"/><text x="20" y="36" style="font-size:16px;font-weight:600">Decode at 4K context</text><g transform="translate(20 62) scale(1.6)"><path d="M8 40A32 32 0 0 1 72 40" class="gb"/><path d="M27.6 10.5A32 32 0 0 1 49.2 9.4" class="gv" pathLength="1" stroke="url(#gr)"/><line x1="30.5" y1="17.4" x2="26.3" y2="7.3" class="g1"/><circle cx="49.2" cy="9.4" r="3.6" class="gd"/></g><text x="158" y="112" class="gnum" style="fill:url(#gt)">1.50x</text><text x="158" y="132" class="m mo" style="font-size:12px">vs rapid-mlx</text><text x="20" y="162" class="m mo" style="font-size:11px">Strim 75.3 vs rapid-mlx 50.1 tok/s</text></g><g transform="translate(350 78)"><rect width="300" height="176" rx="22" class="gcard"/><text x="20" y="36" style="font-size:16px;font-weight:600">Decode at 32K context</text><g transform="translate(20 62) scale(1.6)"><path d="M8 40A32 32 0 0 1 72 40" class="gb"/><path d="M27.6 10.5A32 32 0 0 1 38.8 8" class="gv" pathLength="1" stroke="url(#gr)"/><line x1="30.5" y1="17.4" x2="26.3" y2="7.3" class="g1"/><circle cx="38.8" cy="8" r="3.6" class="gd"/></g><text x="158" y="112" class="gnum" style="fill:url(#gt)">1.24x</text><text x="158" y="132" class="m mo" style="font-size:12px">vs rapid-mlx</text><text x="20" y="162" class="m mo" style="font-size:11px">Strim 52.2 vs rapid-mlx 42.2 tok/s</text></g><g transform="translate(674 78)"><rect width="300" height="176" rx="22" class="gcard"/><text x="20" y="36" style="font-size:16px;font-weight:600">4 agents on a shared 16K prefix</text><g transform="translate(20 62) scale(1.6)"><path d="M8 40A32 32 0 0 1 72 40" class="gb"/><path d="M27.6 10.5A32 32 0 0 1 71.2 33.1" class="gv" pathLength="1" stroke="url(#gr)"/><line x1="30.5" y1="17.4" x2="26.3" y2="7.3" class="g1"/><circle cx="71.2" cy="33.1" r="3.6" class="gd"/></g><text x="158" y="112" class="gnum" style="fill:url(#gt)">2.81x</text><text x="158" y="132" class="m mo" style="font-size:12px">vs mlx-vlm</text><text x="20" y="162" class="m mo" style="font-size:11px">Strim 9.77 vs mlx-vlm 3.47 tok/s</text></g><g transform="translate(26 278)"><rect width="300" height="176" rx="22" class="gcard"/><text x="20" y="36" style="font-size:16px;font-weight:600">8 agents at once: median first token</text><g transform="translate(20 62) scale(1.6)"><path d="M8 40A32 32 0 0 1 72 40" class="gb"/><path d="M27.6 10.5A32 32 0 0 1 54.1 11.3" class="gv" pathLength="1" stroke="url(#gr)"/><line x1="30.5" y1="17.4" x2="26.3" y2="7.3" class="g1"/><circle cx="54.1" cy="11.3" r="3.6" class="gd"/></g><text x="158" y="112" class="gnum" style="fill:url(#gt)">1.66x</text><text x="158" y="132" class="m mo" style="font-size:12px">vs rapid-mlx</text><text x="20" y="162" class="m mo" style="font-size:11px">Strim 13.3 vs rapid-mlx 22.1 s</text></g><g transform="translate(350 278)"><rect width="300" height="176" rx="22" class="gcard loss"/><text x="20" y="36" style="font-size:16px;font-weight:600">Cold 32K prompt: first token</text><text x="280" y="58" text-anchor="end" class="m mo" style="font-size:11px;font-weight:700;letter-spacing:.08em">HONEST LOSS</text><g transform="translate(20 62) scale(1.6)"><path d="M8 40A32 32 0 0 1 72 40" class="gb"/><path d="M27.6 10.5A32 32 0 0 0 25.5 11.5" class="gv lose" pathLength="1"/><line x1="30.5" y1="17.4" x2="26.3" y2="7.3" class="g1"/><circle cx="25.5" cy="11.5" r="3.6" class="gd lose"/></g><text x="158" y="112" class="gnum lose">0.96x</text><text x="158" y="132" class="m mo" style="font-size:12px">vs mlx-vlm</text><text x="20" y="162" class="m mo" style="font-size:11px">Strim 37.1 vs mlx-vlm 35.5 s</text></g><g transform="translate(674 278)"><rect width="300" height="176" rx="22" class="gcard"/><text x="20" y="36" style="font-size:16px;font-weight:600">8 agents at once: total throughput</text><g transform="translate(20 62) scale(1.6)"><path d="M8 40A32 32 0 0 1 72 40" class="gb"/><path d="M27.6 10.5A32 32 0 0 1 27.6 10.5" class="gv" pathLength="1" stroke="url(#gr)"/><line x1="30.5" y1="17.4" x2="26.3" y2="7.3" class="g1"/><circle cx="27.6" cy="10.5" r="3.6" class="gd"/></g><text x="158" y="112" class="gnum" style="fill:url(#gt)">1.00x</text><text x="158" y="132" class="m mo" style="font-size:12px">vs mlx-vlm</text><text x="20" y="162" class="m mo" style="font-size:11px">Strim 31.2 vs mlx-vlm 31.2 tok/s</text></g><text x="26" y="496" class="m mo" style="font-size:11px">Run h2h-final3-20261028, 2026-10-28, medians of 2 passes, M5 Max 64 GB.</text></svg>
