.hv .ls{stroke:#FF4FD0}.hv .lr{stroke:#7C7BFF;stroke-width:1.6}.hv .lv{stroke:#B7B4E0;stroke-width:1.6}.hv .lq{stroke:#FFB454;stroke-width:1.6}.hv .lp{stroke:#5CC8FF;stroke-width:1.6}
.hv .pw rect{fill:#2A1B52;stroke:#D9B8FF}.hv .pl rect{fill:#1C1A3D;stroke:#A29FC8;stroke-dasharray:3 2}.hv .pt rect{fill:#1C1A3D;stroke:#A29FC8}
.hv .pw text{fill:#D9B8FF}.hv .pl text{fill:#A29FC8}.hv .pt text{fill:#A29FC8}
.hv .pw text,.hv .pl text,.hv .pt text{font-size:11px;font-weight:700}
.hv .hh{font-size:13px;font-weight:700}.hv .hv1{font-weight:700}
.hv .nltk{stroke:#A29FC8;opacity:.55}.hv .nlld{stroke:#A29FC8;stroke-width:1;opacity:.5;stroke-dasharray:2 3}.hv .nlld.hot{stroke:#FF4FD0;opacity:.8}
.hv .nldot{fill:#0F0D2B;stroke:#F1EFFF;stroke-width:2}.hv .nlspec{fill:#fff;opacity:.5}
.hv .nlwk{stroke:#A29FC8;stroke-width:2.5;opacity:.6;stroke-linecap:round}
.hv .nlv{font-size:17px;font-weight:600}.hv .nln{font-size:12.5px;fill:#A29FC8}.hv .nln.hot{fill:#F1EFFF;font-weight:600;font-size:14px}
.hv .nlv.hot{font-family:"Space Grotesk",-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:54px;font-weight:700;letter-spacing:-.04em}
.hv .tk{font-size:12px;fill:#A29FC8}
.hv .gcard{fill:rgba(255,255,255,.1);stroke:rgba(255,255,255,.16)}.hv .gcard.loss{stroke-dasharray:5 4}
.hv .gb{fill:none;stroke:rgba(255,255,255,.16);stroke-width:5;stroke-linecap:round}.hv .gv{fill:none;stroke-width:5;stroke-linecap:round}.hv .gv.lose{stroke:#A29FC8}
