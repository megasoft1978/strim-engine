class="gcard"/><text x="20" y="36" style="font-size:16px;font-weight:600">8 agents at once: total throughput</text><g transform="translate(20 62) scale(1.6)"><path d="M8 40A32 32 0 0 1 72 40" class="gb"/><path d="M27.6 10.5A32 32 0 0 1 27.6 10.5" class="gv" pathLength="1"/><line x1="30.5" y1="17.4" x2="26.3" y2="7.3" class="g1"/><circle cx="27.6" cy="10.5" r="3.6" class="gd"/></g><text x="158" y="112" class="gnum">1.00x</text><text x="158" y="132" class="m mo" style="font-size:12px">vs mlx-vlm</text><text x="20" y="162" class="m mo" style="font-size:11px">Strim 31.2 vs mlx-vlm 31.2 tok/s</text></g><text x="26" y="496" class="m mo" style="font-size:11px">Run h2h-final3-20261028, 2026-10-28, medians of 2 passes, M5 Max 64 GB.</text></svg>
