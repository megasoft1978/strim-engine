<svg class="hv" viewBox="0 0 600 542" role="img" aria-labelledby="hv3-t hv3-d" xmlns="http://www.w3.org/2000/svg" width="600" height="542"><title id="hv3-t">First-token latency (TTFT) at 4 and 8 concurrent requests</title><desc id="hv3-d">Grouped bars in seconds for Strim, rapid-mlx and mlx-vlm, median (p50) and 95th percentile (p95), for 512-token, agent-style and 4K prompts. Each rival bar carries a WIN, TIE or LOSS badge for Strim against it.</desc><style>.hv text{font:12px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#15171a}
.hv .m{fill:#565b62}.hv .b{font-weight:700}.hv .s{font-size:10.5px}.hv .c{text-anchor:middle}.hv .e{text-anchor:end}
.hv .bg{fill:#fbfbf9}.hv .hl{fill:#eaf3f0}.hv .g{stroke:#d4d7d1;stroke-width:1;fill:none}.hv .d{stroke-dasharray:3 3}
.hv .bd{fill:#d4d7d1;opacity:.5}.hv .o{stroke:#15171a;stroke-width:1.3}
.hv .fg{fill:#15171a}.hv .fs{fill:#0a665a}.hv .fr{fill:#2c62b4}.hv .fv{fill:#8e3f93}
.hv .ls{stroke:#0a665a}.hv .lr{stroke:#2c62b4;stroke-width:1.6}.hv .lv{stroke:#8e3f93;stroke-width:1.6}
