.hv .hh{font-size:13px;font-weight:700}.hv .hv1{font-weight:700}
}</style><rect class="bg" width="600" height="542" rx="8"/><rect x="8" y="8" width="10" height="10" rx="2" class="fs"/><text x="23" y="18">Strim</text><rect x="69" y="8" width="10" height="10" rx="2" class="fr"/><text x="84" y="18">rapid-mlx (MTP)</text><rect x="194" y="8" width="10" height="10" rx="2" class="fv"/><text x="209" y="18">mlx-vlm (no MTP)</text><text class="b" x="0" y="46">512-token prompts</text><text class="m s" x="262" y="46">0 to 10 s, lower is better</text><text class="m s c" x="478" y="46">vs rapid-mlx</text><text class="m s c" x="558" y="46">vs mlx-vlm</text><g><title>c=4 512-tok prompts p50 TTFT: strim 1.52 s, rapid-mlx 2.38 s, mlx-vlm 2.35 s</title><text x="6" y="70">c=4  p50</text><rect class="fs" x="78" y="54" width="44.6" height="8"/><text class="s" x="126.6" y="61.5">1.52</text><rect class="fr" x="78" y="63.5" width="70" height="8"/><text class="s" x="152" y="71">2.38</text><rect class="fv" x="78" y="73" width="69.1" height="8"/><text class="s" x="151.1" y="80.5">2.35</text><g class="pw"><rect x="440" y="60" width="76" height="15" rx="7.5"/><text class="c" x="478" y="71">WIN 1.57×</text></g><g class="pw"><rect x="520" y="60" width="76" height="15" rx="7.5"/><text class="c" x="558" y="71">WIN 1.55×</text></g></g><g><title>c=4 512-tok prompts p95 TTFT: strim 2.33 s, rapid-mlx 2.38 s, mlx-vlm 2.35 s</title><text x="6" y="104">c=4  p95</text><rect class="fs" x="78" y="88" width="68.4" height="8"/><text class="s" x="150.4" y="95.5">2.33</text><rect class="fr" x="78" y="97.5" width="70" height="8"/><text class="s" x="152" y="105">2.38</text><rect class="fv" x="78" y="107" width="69.1" height="8"/><text class="s" x="151.1" y="114.5">2.35</text><g class="pw"><rect x="440" y="94" width="76" height="15" rx="7.5"/><text class="c" x="478" y="105">WIN 1.02×</text></g><g class="pt"><rect x="520" y="94" width="76" height="15" rx="7.5"/><text class="c" x="558" y="105">TIE 1.01×</text></g></g><g><title>c=8 512-tok prompts p50 TTFT: strim 2.72 s, rapid-mlx 6