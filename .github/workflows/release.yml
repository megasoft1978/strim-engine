name: release

# Tag v<version> -> build -> tarball + DMG -> GitHub release -> Homebrew tap update.
# Manual run (workflow_dispatch) with dry_run=true builds and uploads workflow artifacts only: no release, no tap.
# Flow and owner steps (signing secrets, TAP_GITHUB_TOKEN): packaging/RELEASING.md

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and upload artifacts only; do not create a release or touch the tap"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, test, package
    # Newest hosted Apple Silicon image. Needs Xcode with a Swift 6 toolchain (Package.swift: swift-tools-version 6.0)
    # and the Metal toolchain (mlx-swift compiles default.metallib with `xcrun metal`).
    runs-on: macos-26
    timeout-minutes: 120
    outputs:
      version: ${{ steps.ver.outputs.version }}
    env:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          xc="$(printf "%s\n" /Applications/Xcode_*.app | sort -V | tail -n 1)"; [ -d "$xc" ] || xc=""
          [ -n "$xc" ] || xc="$(xcode-select -p | sed 's#/Contents/Developer##')"
          echo "Using $xc"
          sudo xcode-select -s "$xc"
          xcodebuild -version
          swift --version

      - name: Metal toolchain
        run: |
          if xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            echo "Metal toolchain present"
          else
            echo "Metal toolchain missing; downloading"
            xcodebuild -downloadComponent MetalToolchain
            xcrun -sdk macosx metal --version
          fi

      - name: Cache .build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-${{ runner.os }}-${{ runner.arch }}-

      - name: Build (release)
        run: swift build -c release --disable-sandbox --product strim --product StrimApp

      - name: Version check
        id: ver
        run: |
          v="$(.build/release/strim --version | head -n 1 | awk '{print $2}')"
          echo "strim --version: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$v" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match binary version v$v; bump the version and re-tag"
            exit 1
          fi

      - name: Quick tests
        run: swift test --disable-sandbox --filter 'StrimSiteTests|StrimPullTests|DepthPolicyTests'

      - name: Import signing certificate (optional)
        id: sign
        run: |
          if [ -z "$MACOS_CERT_P12_BASE64" ] || [ -z "$MACOS_CERT_PASSWORD" ]; then
            echo "Signing skipped: MACOS_CERT_P12_BASE64 / MACOS_CERT_PASSWORD not set. Artifacts are ad-hoc signed."
            echo "identity=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          kc="$RUNNER_TEMP/release.keychain-db"; pw="$(uuidgen)"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          id="$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          [ -n "$id" ] || { echo "::error::no Developer ID Application identity in the imported p12"; exit 1; }
          echo "::add-mask::$id"
          echo "identity=$id" >> "$GITHUB_OUTPUT"
          echo "Signing identity imported."

      - name: Notary credentials (optional)
        id: notary
        if: steps.sign.outputs.identity != ''
        run: |
          if [ -n "$APPLE_API_KEY_P8_BASE64" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER_ID" ]; then
            echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            xcrun notarytool store-credentials strim-notary --key "$RUNNER_TEMP/AuthKey.p8" \
              --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID"
            rm -f "$RUNNER_TEMP/AuthKey.p8"
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            xcrun notarytool store-credentials strim-notary --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          else
            echo "Notarization skipped: set APPLE_ID + APPLE_TEAM_ID + APPLE_APP_PASSWORD (or APPLE_API_KEY_P8_BASE64 + APPLE_API_KEY_ID + APPLE_API_ISSUER_ID). Signed but not notarized."
            echo "profile=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "profile=strim-notary" >> "$GITHUB_OUTPUT"

      - name: Package (tarball, app, DMG)
        env:
          IDENTITY: ${{ steps.sign.outputs.identity }}
          PROFILE: ${{ steps.notary.outputs.profile }}
        run: |
          sign=(); notarize=()
          if [ -n "$IDENTITY" ]; then sign=(--sign-identity "$IDENTITY"); fi
          if [ -n "$IDENTITY" ] && [ -n "$PROFILE" ]; then notarize=(--notarize "$PROFILE"); fi
          [ -n "$IDENTITY" ] || echo "Ad-hoc signing (no Developer ID secrets)."
          packaging/release/make-release.sh --out dist ${sign[@]+"${sign[@]}"}
          packaging/app/make-app.sh --out dist ${sign[@]+"${sign[@]}"} ${notarize[@]+"${notarize[@]}"}
          # make-dmg.sh skips the Finder layout by itself when Finder scripting is unavailable (headless runner).
          packaging/app/make-dmg.sh --app dist/Strim.app --out dist ${sign[@]+"${sign[@]}"} ${notarize[@]+"${notarize[@]}"}
          ls -l dist

      - name: Smoke check the DMG
        run: |
          dmg="$(printf "%s\n" dist/Strim-*-arm64.dmg)"
          hdiutil verify "$dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/mnt" "$dmg"
          test -x "$RUNNER_TEMP/mnt/Strim.app/Contents/MacOS/Strim"
          test -x "$RUNNER_TEMP/mnt/Strim.app/Contents/Resources/strim"
          test -f "$RUNNER_TEMP/mnt/Strim.app/Contents/Resources/mlx-swift_Cmlx.bundle/Contents/Resources/default.metallib"
          codesign --verify --deep --strict "$RUNNER_TEMP/mnt/Strim.app"
          hdiutil detach "$RUNNER_TEMP/mnt"

      - uses: actions/upload-artifact@v4
        with:
          name: strim-release
          path: |
            dist/strim-*-arm64-macos.tar.gz
            dist/strim-*-arm64-macos.tar.gz.sha256
            dist/Strim-*-arm64.dmg
            dist/Strim-*-arm64.dmg.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: strim-release
          path: dist
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          files=(dist/*.tar.gz dist/*.tar.gz.sha256 dist/*.dmg dist/*.dmg.sha256)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; replacing assets."
            gh release upload "$TAG" "${files[@]}" --clobber
          elif [ -f RELEASE_NOTES.md ]; then
            gh release create "$TAG" "${files[@]}" --title "Strim ${TAG#v}" --notes-file RELEASE_NOTES.md --verify-tag
          else
            gh release create "$TAG" "${files[@]}" --title "Strim ${TAG#v}" --generate-notes --verify-tag
          fi

  tap:
    name: Update Homebrew tap
    needs: [build, release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
    steps:
      - name: Check token
        id: gate
        run: |
          if [ -z "$TAP_GITHUB_TOKEN" ]; then
            echo "Tap update skipped: repo secret TAP_GITHUB_TOKEN is not set (see packaging/RELEASING.md). Update megasoft1978/homebrew-strim by hand."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.go == 'true'
        with:
          name: strim-release
          path: dist
      - name: Commit formula and cask to the tap
        if: steps.gate.outputs.go == 'true'
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/megasoft1978/homebrew-strim.git" tap
          mkdir -p tap/Formula tap/Casks
          [ -f tap/Formula/strim.rb ] || cp packaging/homebrew/strim.rb tap/Formula/strim.rb
          [ -f tap/Casks/strim-app.rb ] || cp packaging/homebrew/Casks/strim-app.rb tap/Casks/strim-app.rb
          packaging/release/update-tap.sh --tap-dir tap --version "$VERSION" \
            --tarball-sha "$(cat "dist/strim-$VERSION-arm64-macos.tar.gz.sha256")" \
            --dmg-sha "$(cat "dist/Strim-$VERSION-arm64.dmg.sha256")"
          cd tap
          git config user.name "strim-release-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add Formula/strim.rb Casks/strim-app.rb
          if git diff --cached --quiet; then echo "tap already up to date"; exit 0; fi
          git commit -m "strim $VERSION"
          git push origin HEAD
